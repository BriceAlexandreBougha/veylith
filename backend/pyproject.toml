[project]
name = "veylith"
version = "0.1.0"
description = "Moteur de règles du jeu Traversal"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "supabase>=2.15,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
strict = true
