name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Backend unit, integration and API tests
        run: pytest --cov=veylith --cov-report=term-missing --cov-report=xml:coverage.xml -q

      # mypy currently reports pre-existing type errors in the backend; keep it
      # visible in CI without making the test/build gate permanently fail.
      - name: Backend type check (non-blocking baseline)
        continue-on-error: true
        run: mypy src

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: TypeScript check and production build
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create CI-only Supabase placeholders
        run: |
          printf '%s\n' \
            'VITE_SUPABASE_URL=https://ci-placeholder.supabase.co' \
            'VITE_SUPABASE_ANON_KEY=ci-public-placeholder' \
            'FRONTEND_PORT=8080' \
            'BACKEND_PORT=8000' > .env
          printf '%s\n' \
            'SUPABASE_URL=https://ci-placeholder.supabase.co' \
            'SUPABASE_ANON_KEY=ci-public-placeholder' \
            'SUPABASE_SERVICE_ROLE_KEY=ci-secret-placeholder' > backend/.env

      - name: Build and start Compose services, then check HTTP endpoints
        run: |
          trap 'docker compose down --remove-orphans' EXIT
          docker compose up --build -d

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/tmp/veylith-api-health \
              && curl --fail --silent http://127.0.0.1:8080/ >/tmp/veylith-frontend-index; then
              break
            fi
            sleep 2
          done

          grep -q '"status":"ok"' /tmp/veylith-api-health
          grep -q 'id="root"' /tmp/veylith-frontend-index
