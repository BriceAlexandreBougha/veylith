name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Backend unit, integration and API tests
        run: pytest -q

      # mypy currently reports pre-existing type errors in the backend; keep it
      # visible in CI without making the test/build gate permanently fail.
      - name: Backend type check (non-blocking baseline)
        continue-on-error: true
        run: mypy src

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: TypeScript check and production build
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag veylith-backend:ci ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=https://ci-placeholder.supabase.co \
            --build-arg VITE_SUPABASE_ANON_KEY=ci-public-placeholder \
            --build-arg VITE_API_URL=/ \
            --tag veylith-frontend:ci \
            ./frontend
